; OdinGuard client settings (optional; every key has a default). Put this file next to alpha.exe.
; The protection itself (VM block, window limit, input filter, resource rules, tool signatures,
; heartbeat) comes from the server after the handshake and cannot be switched off here.
[OdinGuard]
; Server ports whose connections OdinGuard protects (login, char, map of all realms).
Ports=6900,6121,5121,6901,6122,5122
; Splash screen at client start in milliseconds (0 = off).
SplashMs=1800
; Local fallbacks used before the server policy arrives.
MaxWindows=0
BlockVM=0
; Debug: write every drawn text to odinguard.log (for colour item names). Keep 0 for players.
TextLog=0
