# OdinGuard Anti Cheat – command registry. The Studio lets operators enable, rename and limit every command;
# the server config (conf/odinguard_commands.conf) and the command reference are generated from this file.
#
# kind    server (@ command) | client (! command, typed in chat, answered by the guard)
# group   lowest group level that may use it (0 = players)
# rate_ms minimum time between two uses per character (0 = no limit)

schema = 1

[[command]]
id = "ping"
kind = "client"
name = "ping"
module = "client-commands"
group = 0
rate_ms = 2000
params = ""
help_en = "Shows the latency to the server."
help_de = "zeigt die Verbindungszeit zum Server"

[[command]]
id = "vsync"
kind = "client"
name = "vsync"
module = "client-commands"
group = 0
rate_ms = 1000
params = "[on|off]"
help_en = "Removes or restores the frame limit."
help_de = "Bildraten-Begrenzung aus/an"

[[command]]
id = "crash"
kind = "client"
name = "crash"
module = "client-commands"
group = 0
rate_ms = 60000
params = ""
help_en = "Writes a diagnostic report (odinguard-crash folder) for bug reports."
help_de = "schreibt einen Fehlerbericht (Ordner odinguard-crash) für Bug-Meldungen"

[[command]]
id = "dark"
kind = "client"
name = "dark"
module = "client-commands"
group = 0
rate_ms = 2000
params = "[on|off]"
help_en = "Switches the competitive pack (flat WoE / battleground maps, dark floor) on or off for the next game start."
help_de = "Schaltet das Competitive-Pack (flache WoE-/BG-Maps, dunkler Boden) für den nächsten Spielstart ein oder aus"

[[command]]
id = "lang"
kind = "client"
name = "lang"
module = "client-commands"
group = 0
rate_ms = 2000
params = "[de|en|auto]"
help_en = "Shows or changes the language of OdinGuard's texts (and, later, of the translated game). auto = the Windows language."
help_de = "Zeigt oder ändert die Sprache der OdinGuard-Texte (später auch des übersetzten Spiels). auto = Sprache von Windows"

[[command]]
id = "lgp"
kind = "server"
name = "lgp"
module = "lgp"
group = 0
rate_ms = 1000
params = "[on|off]"
help_en = "Lite ground skills: every ground skill (Storm Gust blue, Lord of Vermilion yellow, Meteor Storm red ...) as flat coloured cells."
help_de = "Lite Ground Skills: alle Bodenskills (Storm Gust blau, Lord of Vermilion gelb, Meteor Storm rot …) als flache farbige Zellen"

[[command]]
id = "square"
kind = "server"
name = "square"
module = "lgp"
group = 0
rate_ms = 1000
params = "[on|off|1-15]"
help_en = "Lite ground skills with a colour set; 1 = each skill in its colour with symbol, 2-15 = one colour for every skill."
help_de = "LGP mit Farbset; 1 = jeder Skill in seiner Farbe mit Symbol, 2-15 = eine Farbe für alle Skills"

[[command]]
id = "circle"
kind = "server"
name = "circle"
module = "lgp"
group = 0
rate_ms = 1000
params = "[on|off|1-5]"
help_en = "Rings of tiles around your own character (1 = 9x9, 2 = 7x7, 3 = 5x5, 4 = all three, 5 = 9 cells)."
help_de = "Ringe aus Kacheln um den eigenen Charakter (1 = 9x9, 2 = 7x7, 3 = 5x5, 4 = alle drei, 5 = 9 Zellen)"

[[command]]
id = "aoes"
kind = "server"
name = "aoes"
module = "lgp"
group = 0
rate_ms = 1000
params = "[on|off]"
help_en = "Coloured areas only for Storm Gust, Lord of Vermilion and Meteor Storm."
help_de = "farbige Flächen nur für Storm Gust, Lord of Vermilion und Meteor Storm"

[[command]]
id = "lgpsound"
kind = "server"
name = "lgpsound"
module = "lgp"
group = 0
rate_ms = 1000
params = "[on|off]"
help_en = "Sound of the ground skills for lite ground skill players (the client's /sound switch still mutes it)."
help_de = "Skill-Sound der Bodenskills für LGP-Spieler (der Client-Schalter /sound schaltet ihn weiterhin stumm)"

[[command]]
id = "namecolor"
kind = "server"
name = "namecolor"
module = "colors"
group = 60
rate_ms = 0
params = "<RRGGBB|off>[, character]"
help_en = "Permanent name colour."
help_de = "dauerhafte Namensfarbe"

[[command]]
id = "ogban"
kind = "server"
name = "ogban"
module = "hwid"
group = 60
rate_ms = 0
params = "<character>[, reason]"
help_en = "Bans the machine of an online character and kicks it."
help_de = "sperrt den Rechner eines Online-Charakters und kickt ihn"

[[command]]
id = "ogunban"
kind = "server"
name = "ogunban"
module = "hwid"
group = 60
rate_ms = 0
params = "<account id>"
help_en = "Lifts the machine bans of all machines the account used."
help_de = "hebt die Rechner-Sperren des Accounts auf"

[[command]]
id = "oginfo"
kind = "server"
name = "oginfo"
module = "core"
group = 40
rate_ms = 0
params = "[character]"
help_en = "Guard version, build, machine and exe hash of a character."
help_de = "Guard-Version, Build, Rechner-ID und EXE-Hash"

[[command]]
id = "ogflags"
kind = "server"
name = "ogflags"
module = "ban-system"
group = 60
rate_ms = 0
params = "[character]"
help_en = "Open flags (rule, score, time) of a player, or the most flagged accounts."
help_de = "offene Flags (Regel, Punkte, Zeit) eines Spielers oder die meistgeflaggten Accounts"

[[command]]
id = "ogbanwave"
kind = "server"
name = "ogbanwave"
module = "ban-system"
group = 99
rate_ms = 0
params = "[dry]"
help_en = "Runs the ban wave now (dry = only list who would be banned)."
help_de = "führt die Ban-Welle jetzt aus (dry = nur auflisten)"

[[command]]
id = "ogflagclear"
kind = "server"
name = "ogflagclear"
module = "ban-system"
group = 60
rate_ms = 0
params = "<character|account id> [rule]"
help_en = "Clears the open flags of an account (false alarms), optionally only one rule."
help_de = "setzt die offenen Flags eines Accounts zurück (Fehlalarme), optional nur eine Regel"

[[command]]
id = "oglock"
kind = "server"
name = "oglock"
module = "hwid"
group = 60
rate_ms = 0
params = "<character>[, add|remove|clear|list]"
help_en = "Locks an account to machines: add/remove the machine the character plays on, clear, list."
help_de = "bindet einen Account an Rechner: den Rechner des Charakters hinzufügen/entfernen, alles löschen, anzeigen"

[[command]]
id = "pf"
kind = "server"
name = "pf"
module = "lgp"
group = 0
rate_ms = 1000
params = "on|off|<c i g>"
help_en = "Packet filter on WoE and battleground maps: no public chat (c), item use (i) or emotions (g) of other players."
help_de = "Paketfilter auf WoE- und BG-Maps: kein öffentlicher Chat (c), keine Item-Nutzung (i) und keine Emotes (g) anderer Spieler"

[[command]]
id = "spb"
kind = "server"
name = "spb"
module = "lgp"
group = 0
rate_ms = 2000
params = ""
help_en = "Support buffs of every party member with the seconds left."
help_de = "Support-Buffs aller Party-Mitglieder mit Restzeit"
