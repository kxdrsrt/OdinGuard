# OdinGuard Anti Cheat – aura catalog (module "auras"). Operators can add their own auras: the Studio checks that
# the effect exists in the client or in odin.grf (tools/check_auras.py) before it is written to the server config.
#
# name     @aura name (lower case, no spaces)
# effect   hat effect id (HatEffectInfo.lub of the client)
# file     .str file under data\texture\effect\ (checked with all its textures); empty = effect built into the exe
#          (only ids tested in game: 25, 26, 27, 29 on the 2018-06-20 client)
# rarity   common | uncommon | rare | epic | legendary
# unlock   quest:<id> (npc/added/shared/odinguard_auras.txt) | mvp:<kills> | bg_wins:<wins> | woe_castles:<castles held
#          at the end of WoE> | event:<name> (F_OG_Milestone "event","<name>" from an event script) | gm
# Auras are never sold for real money.

