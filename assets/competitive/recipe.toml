# OdinGuard competitive pack ("odin-dark.grf"): operator-selectable categories.
#
# Owner decision (2026-11-24): every darkworld / WoE-RO change may be shipped if the operator selects
# it, because every player receives the same pack (one fair standard, like WoE RO / EstlandRO).
# Each category below is a staging folder <staging_root>/<staging>/data/... ; the Studio copies the
# selected folders in the order of the profile list into one tree and builds odin-dark.grf from it
# (profile: assets.competitive_source = <staging_root>, assets.competitive = [<staging>, ...], listed
# in `copy_order`).
#
# Regenerate the folders: tools/pack/build_categories.sh (inputs and usage in its header).
# Entry lists with MD5 per file: assets/competitive/manifests/<category>.tsv.
# Sizes measured 2026-11-24 with rgrf 0.1.0 against client-dev (DATA.INI cdata, core, cpal, data);
# grf_bytes = test GRF built with rgrf build (zlib 9, 0x200), rgrf verify: 0 errors.

schema = 1
staging_root = "~/Dev/OdinGuard-assets/competitive"   # outside the repository
manifests = "assets/competitive/manifests"

# Later folders overwrite earlier ones with the same path. floor-flat-* must come after flat-maps-*.
copy_order = [
  "flat-maps-all", "flat-maps-woe-bg-pvp", "flat-maps-woe", "flat-maps-bg", "flat-maps-pvp",
  "floor", "floor-flat-all", "floor-flat-woe-bg-pvp", "floor-flat-woe", "floor-flat-bg", "floor-flat-pvp",
  "trees", "barricades", "pneuma", "nodelay", "effects", "ui", "other",
]

[load_order]
data_ini = ["0=odin.grf", "1=odin-dark.grf", "2..=the client's own GRFs in their order"]
notes = """
odin.grf wins over odin-dark.grf: its LGP tiles data\\texture\\effect\\hanmoon1.tga and hanmoon2.tga
also exist in the effects category (darkworld: 1x1 magenta) and stay OdinGuard's.
odin-dark.grf wins over every client GRF, also over the server's own cdata.grf (effects 8, other 11
files) and cpal.grf (nodelay: 49 body sprites).
Paths are stored in cp949 exactly as in the client's data.grf (Korean folders, e.g. 몬스터 = b8 f3 bd ba c5 cd);
the client compares names without case, so 22 entries that differ from data.grf only in case
(e.g. trees JA_FF1.bmp, flat-maps Tha_t05.gat) replace the original.
"""

