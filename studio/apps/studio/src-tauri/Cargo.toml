[package]
name = "odinguard-studio"
description = "OdinGuard Anti Cheat Studio (Tauri 2)"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["The OdinGuard Authors"]
publish = false

[lib]
name = "odinguard_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "odinguard-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
og-core = { path = "../../../crates/og-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.6", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-updater = "2"
toml = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
