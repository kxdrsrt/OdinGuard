[workspace]
resolver = "3"
members = ["crates/og-core", "crates/og-cli"]
exclude = ["apps/studio"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["The OdinGuard Authors"]
publish = false

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
