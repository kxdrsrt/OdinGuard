[package]
name = "og-core"
description = "OdinGuard Anti Cheat Studio core: profiles, module and command registry, keys, signature packages, release builds, updates, rollout"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
encoding_rs = "0.8.44"
hex = "0.4"
minisign-verify = "0.2"
rgrf-audio = { path = "../../vendor/rgrf-audio" }
rgrf-core = { path = "../../vendor/rgrf-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
minisign = "0.7"
