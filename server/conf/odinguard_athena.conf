// OdinGuard Anti Cheat settings. Local overrides: conf/import/odinguard_conf.txt (created at the first start).
// The OdinGuard Studio generates the profile values (key, proto salt, build secret, signature package, module
// switches, commands, auras) into conf/import/odinguard_conf.txt; the environment variables ODINGUARD_KEY,
// ODINGUARD_PROTO_SALT and ODINGUARD_BUILD_SECRET override them (keep them out of git).

// Turn the protocol on. Clients with OdinGuard then talk encrypted; clients without it still work
// unless og_required is on.
og_enable: no

// Refuse logins (and char/map connections) of clients without OdinGuard.
og_required: no

// Only write events (console + og_event table) instead of kicking/banning. Use it for the first days.
og_log_only: yes

// Ed25519 seed of the server, 64 hex characters (tools/og_keygen.py in the OdinGuard repo).
// Keep it secret; the matching public key is compiled into odinguard.dll.
//og_key:

// Oldest accepted client protocol version (2 = OdinGuard Anti Cheat 1.x; lower values are raised to 2).
og_min_version: 2

// Profile values of the client build (Studio): protocol salt (32 hex) and build secret (64 hex). A client built
// for another profile is refused with a message. Empty salt = the development profile.
//og_proto_salt:
//og_build_secret:

// Heartbeat: the client reports every og_alive_interval seconds, missing reports for
// og_alive_timeout seconds disconnect the player.
og_alive_interval: 30
og_alive_timeout: 120

// Client side: maximum game windows per computer (0 = unlimited) and refuse virtual machines.
og_max_windows: 0
og_block_vm: no
og_vm_action: kick

// Server side: maximum characters online from one machine (hardware id; 0 = unlimited, GMs not counted).
og_max_per_machine: 0

// A login is refused when at least this many identifying hardware parts (machine guid, volume serial,
// disk serial, mac, smbios uuid) are equal to those of a banned machine. The new id is banned too.
og_ban_match: 2

// Block synthetic mouse/keyboard input (macros, auto-pot tools) in the game window.
og_input_filter: no

// Report resource overrides (loose files in data\ or unknown GRFs that replace protected files).
og_grf_strict: no

// Actions: log, kick, ban (machine ban + kick), flag (score in og_flag, player stays) or flagban (flag now, ban
// with the next ban wave, so a cheater cannot tell which check fired).
og_integrity_action: kick
og_tamper_action: kick
og_grf_action: kick
og_inject_action: log

// Allowed in-memory code hashes of the game exe (from the client report, odinguard.log "exe_code").
// Empty = every exe is accepted. One line per allowed build.
//og_allowed_exe: <64 hex characters>

// Known cheat and automation tools: kind (process, window or module), action, pattern.
// The pattern is matched case-insensitively as part of the process file name, the window title
// or the module file name. The list is sent to the client at login, so it can be changed
// without a client update.
og_signature: process,kick,openkore
og_signature: window,kick,OpenKore
og_signature: process,kick,wpepro
og_signature: window,kick,WPE PRO
og_signature: module,kick,wpespy
og_signature: process,kick,rpe.exe
og_signature: window,kick,Redox Packet Editor
og_signature: process,kick,potnd
og_signature: window,kick,PotND
og_signature: process,kick,meth4u
og_signature: process,kick,xrag
og_signature: window,kick,xRag
og_signature: process,kick,xlike
og_signature: window,kick,xLike
og_signature: process,kick,rotools
og_signature: window,kick,RO Tools
og_signature: process,kick,cheatengine
og_signature: window,kick,Cheat Engine
og_signature: module,kick,speedhack-i386
og_signature: module,kick,vehdebug-i386
og_signature: process,log,x32dbg
og_signature: process,log,ollydbg

// ---- Display features (map-server; need OdinGuard on the client) ----

// Lite ground skills (@lgp, @square, @circle, @aoes): [style,]<skill id>,<unit id>. For players with LGP on, the
// cells of these skills are drawn with a flat ground unit and the heavy animation is not sent. Styles: square
// (default), circle, set2 .. set14 (@square <n>). odin.grf replaces the textures of the units 0xc8 (hanmoon1.tga,
// blue tile) and 0xc9 (hanmoon2.tga, orange tile); without odin.grf use 0x9b (Deluge) like v0.3.
// Unit ids: 0x9a red (Volcano), 0x9b blue (Deluge), 0x9c green (Violent Gale), 0x9d Land Protector glyphs,
// 0xc8/0xc9 (no skill uses them). 0 removes an entry. og_lgp_aoes: skills shown with @aoes.
og_lgp: 89,0xc8
og_lgp: 83,0xc9
og_lgp: 85,0xc8
og_lgp: 91,0x9c
og_lgp: 539,0xc8
og_lgp: 540,0x9c
og_lgp: 541,0x9c
og_lgp: circle,89,0x9b
og_lgp: circle,83,0x9a
og_lgp: circle,85,0x9b
og_lgp: set2,89,0xc9
og_lgp: set2,83,0xc8
og_lgp: set2,85,0xc9
og_lgp_aoes: 89,83,85

// Aura catalog (module auras): <name>,<hat effect id>,<rarity>,<unlock>. Players wear only auras they unlocked
// (quests in npc/added/odinguard_auras.txt, MVP kills, BG wins, castles after WoE, events); GMs set any.
// Only effects whose files are in the client may be listed (OdinGuard tools/check_auras.py, Studio check):
// on the 2018-06-20 client 82-84 crash (files missing), 59-78, 93/94, 99-120, 123 draw nothing, and the
// .str effects 2, 33, 40, 48, 52, 55, 80, 85, 86, 89, 96, 121 miss files. 0 as id removes a name.
// og_aura_scope: account (unlocks shared by all characters of the account) or character.
og_aura_scope: account
og_aura: green,25,common,quest:aura_t1
og_aura: yellow,27,common,quest:aura_t1
og_aura: circle,26,common,quest:aura_t1
og_aura: violet,29,common,quest:aura_t1
og_aura: blossom,1,uncommon,quest:aura_t2
og_aura: feathers,39,uncommon,quest:aura_t2
og_aura: butterfly,12,uncommon,quest:aura_t2
og_aura: floral,44,uncommon,quest:aura_t2
og_aura: snowflake,91,uncommon,quest:aura_t2
og_aura: stars,81,uncommon,quest:aura_t2
og_aura: firework,51,uncommon,quest:aura_t2
og_aura: magicfeather,45,uncommon,quest:aura_t2
og_aura: banish,3,rare,bg_wins:25
og_aura: ljosalfar,4,rare,bg_wins:100
og_aura: valhalla,18,rare,woe_castles:3
og_aura: angelstairs,19,rare,mvp:25
og_aura: newyear,20,rare,mvp:100
og_aura: glory,92,epic,woe_castles:10
og_aura: angelfeather,13,epic,mvp:250
og_aura: angelblessing,14,epic,bg_wins:250
og_aura: magiccircle,56,epic,woe_castles:25
og_aura: rainbowcircle,90,legendary,mvp:500
og_aura: fluffywing,95,legendary,bg_wins:500
og_aura: poring,97,legendary,event:poring
og_aura: blackbutterfly,53,legendary,event:halloween
og_aura: cherrytree,79,legendary,event:spring
og_aura: scaraba,54,legendary,event:lms
og_aura: taego,98,legendary,event:invasion
og_aura: water,122,legendary,event:summer

// Name colour per account group: <group id>,<RRGGBB>. Single characters: @namecolor.
og_group_namecolor: 99,FFD700
og_group_namecolor: 10,7FD4FF

// Item name colour: <item id>,<RRGGBB> (the item database name must match the client item name).
//og_item_color: 4128,FFB000
//og_item_color: 7829,FF6040

// ---- Module switches (Studio profile). Server-only modules work for every client, also without the guard ----
// og_hwid, og_multi_client, og_heartbeat, og_integrity, og_signatures, og_grf_rules, og_client_commands, og_colors,
// og_lgp_enable, og_auras_enable, og_ban_system: on by default. New protection modules are off by default:

// rate-limit: game packets per second per connection, 3 seconds above the limit fire the rule.
og_rate_limit: no
og_rate_pps: 150
og_rate_action: kick

// behaviour: skill requests inside the delay (no-delay), autopot reaction time, macro timing (constant intervals).
og_behaviour: no
og_bh_nodelay: 120
og_bh_autopot_ms: 90
og_bh_macro_jitter: 4
og_bh_action: flagban

// ban-system: daily ban wave at this hour (server time, -1 = only @ogbanwave) for accounts whose open
// "flagban" flags reach og_ban_score. Warn mode (og_log_only) never bans.
og_ban_system: yes
og_banwave_hour: 4
og_ban_score: 100

// Challenges (server -> guard). Each: switch, interval in seconds (sent at a random time between 0.5x and 1.5x),
// action on a wrong or missing answer.
og_ch_nonce: no
og_ch_nonce_interval: 300
og_ch_nonce_action: flagban
og_ch_code: no
og_ch_code_interval: 600
og_ch_code_action: flagban
og_ch_time: no
og_ch_time_interval: 60
og_ch_time_drift: 6
og_ch_time_action: flag
og_ch_file: no
og_ch_file_interval: 900
og_ch_file_action: kick
// bot captcha after a behaviour flag (outside WoE/BG/PvP), uses db/captcha_db.yml and the macro detector window
og_ch_captcha: no
// invisible decoy monster next to the player; only bots act on it
og_ch_honeypot: no
og_ch_honeypot_action: flagban

// References for the challenges and the self integrity: the release guard DLL of this profile, a reference dump of
// the exe code (odinguard-code.bin from an operator build) and the official protected files
// (<index in the profile file list>,<path on the server>,<required yes/no>).
//og_guard_file: conf/odinguard/odinguard.dll
//og_exe_reference: conf/odinguard/exe-code.bin
//og_protected_file: 0,conf/odinguard/odin.grf,yes
//og_protected_file: 1,conf/odinguard/odin-dark.grf,no

// Signed signature package of the Studio (cheat-signatures module) and the Studio's signing key (public).
//og_sigpack: conf/odinguard/odinguard.sigpack
//og_sigpack_key: <64 hex characters>
//og_sigpack_min_version: 0

// Command registry (generated by the Studio from commands.toml): og_cmd_<id> on/off, og_cmdgroup_<id> lowest
// group level, og_cmdrate_<id> milliseconds between two uses, og_cmdname_<id> new name of a ! client command.
//og_cmd_lgp: yes
//og_cmdrate_lgp: 1000
//og_cmdname_ping: ping

import: conf/import/odinguard_conf.txt
