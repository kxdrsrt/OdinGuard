[[allow]]
id = "OG-ALLOW-RULE-001"
source = "ROExt legit (generic)"
kind = "rule"
pattern = "module=ijl15r.dll;exports:ijlInit,ijlFree,ijlRead,ijlWrite;verinfo:FileDescription=Ragnarok Extension"
note = "ROExt is allowed only as the ijl15 proxy with an allowlisted hash. The same FileDescription/LegalCopyright ('Ruri') as dinput.dll (export DirectInputCreateA) is NOT allowed (OG-ROEXT-*)."

[[allow]]
id = "OG-ALLOW-RULE-002"
source = "DxWrapper (generic)"
kind = "rule"
pattern = "module=ddraw.dll|dxwrapper.dll;sha256 in allowlist;dxwrapper.ini:LoadCustomDllPath=;dxwrapper.ini:LoadPlugins=0"
note = "DxWrapper can load extra DLLs (LoadCustomDllPath, plugins). Allow only with allowlisted hashes and with these ini values; otherwise report the loaded custom DLL."

[[allow]]
id = "OG-ALLOW-RULE-003"
source = "Microsoft runtimes (generic)"
kind = "rule"
pattern = "authenticode:O=Microsoft Corporation"
note = "MSVC runtimes in other versions are acceptable when Microsoft-signed; unsigned copies only by hash."

[[allow]]
id = "OG-ALLOW-RULE-004"
source = "OdinGuard (generic)"
kind = "rule"
pattern = "module=odinguard.dll|ijl15.dll;hash from OdinGuard release manifest"
note = "Prefer the signed release manifest (tools/make_manifest.py) over fixed hashes for OdinGuard's own files."

