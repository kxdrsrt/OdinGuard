# OdinGuard cheat signatures, generated 2026-11-23 by static analysis only (no execution).
# Extended 2026-11-24 (second batch at the end of the file): deeper static analysis (named mutex/event, registry,
# window classes, PDB/version strings, statically decoded RoMedic SmartAssembly resources and the embedded AHK
# script of autopot.exe), public-knowledge entries for tools NOT in the folder (OpenKore, WPE, rPE, Cheat Engine,
# ArtMoney, speed hacks, macro tools, debuggers, injectors; no binaries downloaded) and the migration of every
# og_signature line of xAthena-HR conf/odinguard_athena.conf (substring rules -> exact names, see notes).
# Source material: "<cheat sample folder>".
# Generators: analysis/_work/cheatsig/gen.py, analysis/_work/cheatre/gen_add.py (work folders are git-ignored).
# Groups: AHK APOT DD GRF RCX ROEXT ROMED WOERO (folder samples), THOTH DESU GRFNAME (cheat GRF file names),
#         OPENKORE WPE RPE CE ARTMONEY SPEED MACRO ROMISC DEBUG INJECT (public knowledge, confidence medium/low).
# Policy: debuggers, system tools and generic macro interpreters are log/flag only, never ban; window_title
#         substrings are flag at most (browser tabs match), kick/ban needs an injected module, hash or a second signal.
#
# Pattern conventions (all comparisons case-insensitive unless a hash):
#   process        exact lower-case image file name
#   window_class   exact window class name; window_title: substring of the title
#   module         exact lower-case module file name. Never use a generic name (dinput.dll, ddraw.dll)
#                  alone - those are only listed as file_sha256.
#   file_name      exact lower-case file name (client folder unless the note says otherwise)
#   file_sha256 / grf_sha256   lower-case hex SHA-256 of the whole file
#   grf_entry      '<lower-case path as stored in the GRF, CP949 decoded to UTF-8, backslashes>|<md5 of
#                  decoded content>'. '*|<md5>' = the same content under any path (content-class rule).
#   import_pattern 'exports:a,b,c' = module exports all names; ';verinfo:Key=Value' = plus version string
#   string_pattern 'ascii:<text>' / 'utf16:<text>' = bytes in the module/process image or file,
#                  'section:<name>' = PE section name
#   driver         service / driver name; registry: key path
#   mutex          exact name of a named mutex/event/section, without Global\ or Local\ (client tries both)
#   registry       "HKCU\path" or "HKLM\path" key (32- and 64-bit views)
# Mapping to og_proto.h kinds: process=1, window_title=2, module=3, window_class=7, file_name=8,
# file_sha256=9, driver=10, grf_sha256=11, mutex=16, registry=17. grf_entry, import_pattern and string_pattern
# have no wire kind (analysis-only / server tooling; OG_KIND_GRF=5 is report-only).
# confidence: high = exact hash or tool-unique string; medium = specific but renamable or generic tool;
# low = context only. action is the default suggestion.

schema = 1

